                                return ' Humedad: ' + context.parsed.y.toFixed(2) + ' %';
                            }
                        }
                    },
                    zoom: {
                        zoom: {
                            wheel: { enabled: true },
                            pinch: { enabled: true },
                            mode: 'x',
                        },
                        pan: {
                            enabled: true,
                            mode: 'x',
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Fecha y Hora',
                            font: { size: 12, weight: 'bold' },
                            padding: { top: 12 }
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Humedad (%)',
                            font: { size: 12, weight: 'bold' },
                            padding: { bottom: 12 }
                        },
                        grid: { color: 'rgba(200,200,200,0.3)' },
                        ticks: {
                            callback: function(value) {
                                return value.toFixed(2);
                            }
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
